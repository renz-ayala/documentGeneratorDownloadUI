<div class="navbar bg-base-100 shadow-sm">
  <div class="flex-1">
    <a class="btn btn-ghost text-xl">Document AI</a>
  </div>

  <label class="flex cursor-pointer gap-2">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round">
      <circle cx="12" cy="12" r="5" />
      <path
        d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
    </svg>

    <input
      #toggle
      type="checkbox"
      value="synthwave"
      class="toggle theme-controller"
      [checked]="themeService.currentTheme() === 'black'"
      (change)="themeService.setTheme(toggle.checked ? 'black':'light')"
    />

    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </label>
</div>

<div class="w-full max-w-5xl mx-auto p-6 flex flex-col items-center justify-center gap-6">
  <div class="card bg-base-100 w-96 shadow-sm">
    <div
      [innerHTML]="safePreviewHtml()"
      class="h-96 w-full p-4 border border-base-300 rounded-lg bg-base-100 overflow-y-auto prose max-w-none">
    </div>
    <div class="card-body">
      <h2 class="card-title">Edit Mode</h2>
      <p>Adjust the HTML content before compilation</p>

      <div class="card-actions justify-end">
        <button
          [appBtnLoading]="isExporting()"
          class="btn btn-primary"
          (click)="exportDocument('pdf')"
          [disabled]="isExporting()"
        >
          @if (isExporting()) {
            Downloading...
          } @else {
            Download .pdf
          }
        </button>

        <button
          [appBtnLoading]="isExporting()"
          class="btn btn-primary"
          (click)="exportDocument('docx')"
          [disabled]="isExporting()"
        >
          @if (isExporting()) {
            Downloading...
          } @else {
            Download .docx
          }
        </button>
      </div>
    </div>
  </div>

  <textarea
    class="textarea h-96"
    [value]="htmlContent()"
    (input)="onContentChange($event)"
    placeholder="Bio"
  >
  </textarea>
</div>
